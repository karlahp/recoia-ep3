services:
  api:
    build: ./api
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  # --- Bus de mensajes (opcional): se activa con --profile bus ---
  rabbitmq:
    image: rabbitmq:3.13-alpine
    profiles: ["bus"]
    restart: unless-stopped

  worker:
    image: python:3.11-slim
    profiles: ["bus"]
    env_file: .env
    volumes:
      - ./worker:/app:ro
    command: sh -c "pip install --no-cache-dir pika==1.3.2 && python /app/worker.py"
    depends_on:
      - rabbitmq
    restart: unless-stopped

networks:
  default:
    name: recoia-net
